name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: কোড চেকআউট
        uses: actions/checkout@v4

      - name: Java সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter সেটআপ
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Android নেটিভ ফাইল অটো-জেনারেট করা
        run: flutter create --platforms=android --org com.shopnobaz .

      - name: Kotlin ভার্সন আপডেট করা
        run: sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/' android/settings.gradle

      - name: ডিপেন্ডেন্সি ইনস্টল
        run: flutter pub get

      - name: APK বিল্ড (release)
        run: flutter build apk --release

      - name: APK আপলোড (Artifact হিসেবে)
        uses: actions/upload-artifact@v4
        with:
          name: shopnobaz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
